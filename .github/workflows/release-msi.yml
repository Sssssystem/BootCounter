name: Build and Release Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cx_Freeze
        run: python -m pip install --upgrade pip cx_Freeze

      - name: Build Application Files
        run: python setup_msi.py build_exe --build-exe="build\BootCounter_App"

      - name: Compile Modern Windows Installer (Inno Setup 6)
        run: iscc BootCounter_Setup.iss

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BootCounter-Setup
          path: dist/BootCounter_Setup_*.exe

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BootCounter_Setup_*.exe
          generate_release_notes: true

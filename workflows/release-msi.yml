name: Build and Release Windows Native Installer (Nuitka)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-native-installer:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Nuitka
        run: python -m pip install --upgrade pip nuitka ordered-set zstandard

      - name: Compile to Native C/C++ Machine Code (Nuitka)
        shell: cmd
        run: |
          if exist "build\BootCounter_App" rmdir /s /q "build\BootCounter_App"
          if exist "build\boot_counter.dist" rmdir /s /q "build\boot_counter.dist"
          python -m nuitka --standalone --windows-console-mode=disable --enable-plugin=tk-inter --windows-icon-from-ico=app.ico --include-data-files=app.ico=app.ico --output-dir=build --output-filename=BootCounter.exe --assume-yes-for-downloads boot_counter.py || exit /b 1
          rename "build\boot_counter.dist" "BootCounter_App" || exit /b 1

      - name: Compile Modern Windows Installer (Inno Setup 6)
        run: iscc BootCounter_Setup.iss

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BootCounter-Native-Setup
          path: dist/BootCounter_Setup_*.exe

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BootCounter_Setup_*.exe
          generate_release_notes: true
